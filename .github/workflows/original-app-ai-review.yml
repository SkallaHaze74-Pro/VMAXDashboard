name: VMAX Original App AI Review

on:
  push:
    branches: [main]
    paths:
      - 'reverse-engineering/reports/ORIGINAL_APP_DEEP_SCAN_2026-08-21.md'
      - 'reverse-engineering/reports/DEEP_FINDINGS_2026-08-05.md'
      - 'reverse-engineering/reports/LIBBLE_READ_CHARACTERISTICS_2026-08-21.md'
      - 'reverse-engineering/reports/VMAX_VCORE_HYENA_SEPARATION_2026-08-21.md'
      - 'reverse-engineering/reports/BT638_HANDSHAKE_AUTH_EVIDENCE_2026-08-21.md'
      - 'tools/decoder_ai/original_app_semantics.json'
      - 'tools/decoder_ai/original_app_provider_review.py'
      - 'tools/decoder_ai/provider_review.py'
      - 'tools/decoder_ai/provider_retry.py'
      - 'tools/decoder_ai/review_output_guard.py'
      - 'tools/decoder_ai/test_original_app_compare.py'
      - 'tools/decoder_ai/test_provider_review.py'
      - 'tools/decoder_ai/test_provider_retry_stability.py'
      - '.github/workflows/original-app-ai-review.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vmax-original-app-ai-review
  cancel-in-progress: false

jobs:
  original-app-review:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Review-Code validieren
        run: |
          python -m py_compile \
            tools/decoder_ai/provider_review.py \
            tools/decoder_ai/provider_retry.py \
            tools/decoder_ai/review_output_guard.py \
            tools/decoder_ai/original_app_provider_review.py \
            tools/decoder_ai/test_provider_retry_stability.py
          PYTHONPATH=tools/decoder_ai \
            python -m unittest discover -s tools/decoder_ai -p 'test_*.py'

      - name: Gemini und GLM auf Original-App-Funde ansetzen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          PYTHONPATH=tools/decoder_ai \
            python tools/decoder_ai/original_app_provider_review.py

      - name: AI-Zweitprüfung speichern
        run: |
          set -euo pipefail
          git config user.name 'VMAX Original App AI Review'
          git config user.email 'actions@users.noreply.github.com'

          tmp_dir="$(mktemp -d)"
          cp reverse-engineering/reports/ORIGINAL_APP_AI_REVIEW_2026-08-21.json "$tmp_dir/review.json"
          cp reverse-engineering/reports/ORIGINAL_APP_AI_REVIEW_2026-08-21.md "$tmp_dir/review.md"
          review_fingerprint="$(python -c 'import json; print(json.load(open("reverse-engineering/reports/ORIGINAL_APP_AI_REVIEW_2026-08-21.json"))["inputFingerprint"])')"

          # Provider-Aufrufe können mehrere Minuten dauern. Währenddessen darf main
          # durch andere Analysejobs weiterlaufen. Darum auf den aktuellen Remote-
          # Stand wechseln und ausschließlich die frisch erzeugten Review-Artefakte
          # darüberlegen. Das verhindert Rebase-Konflikte in genau diesen Dateien.
          git fetch origin main
          git reset --hard origin/main
          current_fingerprint="$(PYTHONPATH=tools/decoder_ai python tools/decoder_ai/original_app_provider_review.py --fingerprint-only)"
          if [ "$review_fingerprint" != "$current_fingerprint" ]; then
            echo 'Original-App-Evidenz hat sich während des Providerlaufs geändert; veraltetes Review wird nicht veröffentlicht.'
            exit 0
          fi
          cp "$tmp_dir/review.json" reverse-engineering/reports/ORIGINAL_APP_AI_REVIEW_2026-08-21.json
          cp "$tmp_dir/review.md" reverse-engineering/reports/ORIGINAL_APP_AI_REVIEW_2026-08-21.md

          git add \
            reverse-engineering/reports/ORIGINAL_APP_AI_REVIEW_2026-08-21.json \
            reverse-engineering/reports/ORIGINAL_APP_AI_REVIEW_2026-08-21.md
          if git diff --cached --quiet; then
            echo 'Keine Änderung an der AI-Zweitprüfung.'
            exit 0
          fi
          git commit -m 'Original-App: Gemini/GLM Deep Review aktualisieren'
          git push origin HEAD:main
