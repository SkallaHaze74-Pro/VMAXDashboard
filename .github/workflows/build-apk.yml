name: Scooter Telemetry VX Test-Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signaturschlüssel wiederherstellen
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_BASE64" || (echo "GitHub Secret SIGNING_KEY_BASE64 fehlt" && exit 1)
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/vmax-release-key.jks"

      - name: Signierte Release-APK bauen
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/vmax-release-key.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_STORE_PASSWORD" || (echo "GitHub Secret SIGNING_STORE_PASSWORD fehlt" && exit 1)
          test -n "$SIGNING_KEY_ALIAS" || (echo "GitHub Secret SIGNING_KEY_ALIAS fehlt" && exit 1)
          test -n "$SIGNING_KEY_PASSWORD" || (echo "GitHub Secret SIGNING_KEY_PASSWORD fehlt" && exit 1)

          export VERSION_CODE=$((5200 + GITHUB_RUN_NUMBER))
          export VERSION_NAME="5.2.${GITHUB_RUN_NUMBER}"

          gradle assembleRelease bundleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "Scooter-Telemetry-VX-v${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "Scooter-Telemetry-VX-v${VERSION_NAME}.aab"

      - name: Update-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Scooter-Telemetry-VX-Test-Build
          path: |
            Scooter-Telemetry-VX-v*.apk
            Scooter-Telemetry-VX-v*.aab
          if-no-files-found: error
