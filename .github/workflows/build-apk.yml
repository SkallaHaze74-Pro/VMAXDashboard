name: VMAX Dashboard Fahrdaten Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      EXPECTED_PACKAGE_NAME: de.kevin.vmaxdashboard
      EXPECTED_SIGNER_SHA256: 323be81f5195fb162b571dcdeed36911d869f78d1f39a37c8228c0872729b06f

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Fahrdaten-Buildnummer festlegen
        run: |
          set -euo pipefail
          expected_version_code=$((7000 + GITHUB_RUN_NUMBER))
          expected_version_name="7.0.${GITHUB_RUN_NUMBER}-fahrdaten"
          {
            echo "VERSION_CODE=$expected_version_code"
            echo "VERSION_NAME=$expected_version_name"
            echo "EXPECTED_VERSION_CODE=$expected_version_code"
            echo "EXPECTED_VERSION_NAME=$expected_version_name"
          } >> "$GITHUB_ENV"

      - name: Decoder- und App-Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Debug-APK bauen
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "VMAXDashboard-v${VERSION_NAME}-Debug.apk"

      - name: Debug-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: VMAXDashboard-Fahrdaten-Debug
          path: VMAXDashboard-v*-Debug.apk
          if-no-files-found: error

      - name: Release-Signatur prüfen
        if: github.ref == 'refs/heads/main'
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$SIGNING_KEY_BASE64" ] || missing+=(SIGNING_KEY_BASE64)
          [ -n "$SIGNING_STORE_PASSWORD" ] || missing+=(SIGNING_STORE_PASSWORD)
          [ -n "$SIGNING_KEY_ALIAS" ] || missing+=(SIGNING_KEY_ALIAS)
          [ -n "$SIGNING_KEY_PASSWORD" ] || missing+=(SIGNING_KEY_PASSWORD)
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Release abgebrochen: Signatur-Secrets fehlen: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Signaturschlüssel wiederherstellen
        if: github.ref == 'refs/heads/main'
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/vmax-release-key.jks"
          test -s "$RUNNER_TEMP/vmax-release-key.jks"

      - name: Signierte Release-APK bauen
        if: github.ref == 'refs/heads/main'
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/vmax-release-key.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --stacktrace

      - name: Signatur und APK-Metadaten verifizieren
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk_path"

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root" ]; then
            echo "Android SDK nicht gefunden." >&2
            exit 1
          fi

          find_android_tool() {
            local tool_name="$1"
            local tool_path
            tool_path="$(command -v "$tool_name" || true)"
            if [ -z "$tool_path" ]; then
              tool_path="$(find "$sdk_root" -type f -name "$tool_name" -perm -111 -print | sort -V | tail -n 1)"
            fi
            if [ -z "$tool_path" ] || [ ! -x "$tool_path" ]; then
              echo "Android-Prüfwerkzeug nicht gefunden: $tool_name" >&2
              exit 1
            fi
            printf '%s\n' "$tool_path"
          }

          apksigner="$(find_android_tool apksigner)"
          apkanalyzer="$(find_android_tool apkanalyzer)"

          signer_output="$("$apksigner" verify --verbose --print-certs "$apk_path")"
          printf '%s\n' "$signer_output"

          mapfile -t signer_digests < <(
            printf '%s\n' "$signer_output" |
              awk -F': ' '/^Signer #[0-9]+ certificate SHA-256 digest:/ { print tolower($NF) }'
          )
          if [ "${#signer_digests[@]}" -ne 1 ]; then
            echo "Erwartet wurde genau ein APK-Signaturzertifikat, gefunden: ${#signer_digests[@]}" >&2
            exit 1
          fi
          if [ "${signer_digests[0]}" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "Falsches Signaturzertifikat: ${signer_digests[0]}" >&2
            exit 1
          fi

          actual_package="$("$apkanalyzer" manifest application-id "$apk_path" | tr -d '\r\n')"
          actual_version_code="$("$apkanalyzer" manifest version-code "$apk_path" | tr -d '\r\n')"
          actual_version_name="$("$apkanalyzer" manifest version-name "$apk_path" | tr -d '\r\n')"

          [ "$actual_package" = "$EXPECTED_PACKAGE_NAME" ] || {
            echo "Falscher Paketname: $actual_package" >&2
            exit 1
          }
          [ "$actual_version_code" = "$EXPECTED_VERSION_CODE" ] || {
            echo "Falscher versionCode: $actual_version_code (erwartet: $EXPECTED_VERSION_CODE)" >&2
            exit 1
          }
          [ "$actual_version_name" = "$EXPECTED_VERSION_NAME" ] || {
            echo "Falscher versionName: $actual_version_name (erwartet: $EXPECTED_VERSION_NAME)" >&2
            exit 1
          }

          cp "$apk_path" "VMAXDashboard-v${VERSION_NAME}-Release.apk"
          echo "Release-APK vollständig verifiziert."

      - name: Release-APK bereitstellen
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: VMAXDashboard-Fahrdaten-Release
          path: VMAXDashboard-v*-Release.apk
          if-no-files-found: error
