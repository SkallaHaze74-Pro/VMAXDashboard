name: VMAX Dashboard Parallel-Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/native-telemetry-parallel-test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Parallel-Test-APK bauen
        run: |
          export VERSION_CODE=$((6700 + GITHUB_RUN_NUMBER))
          export VERSION_NAME="6.7.${GITHUB_RUN_NUMBER}-parallel-test"
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "VMAXDashboard-v${VERSION_NAME}-Parallel-Test.apk"

      - name: Parallel-Test-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: VMAXDashboard-Parallel-Test
          path: VMAXDashboard-v*-Parallel-Test.apk
          if-no-files-found: error
