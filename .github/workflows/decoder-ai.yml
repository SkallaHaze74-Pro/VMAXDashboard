name: VMAX Decoder AI

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/decoder_ai/**'
      - '.github/workflows/decoder-ai.yml'
      - 'app/src/main/java/de/kevin/vmaxdashboard/AdaptiveDecoderProfileStore.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/AdaptiveDecoderRuntime.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/BleScooterManager.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/DecoderAiCloudSync.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/ExternalAi*.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/GitHubSyncActivity.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/GitHubTelemetrySync.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/LearningProfileStore.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/MeasurementAnalyzer.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/ScooterState.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/LiveTelemetryDecoder.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/OriginalSdkRealtimeDecoder.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/VmaxDecoderPolicy.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/VmaxProtocolCatalog.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/VmaxSdkCapabilityCatalog.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/MainActivity.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/VMAXSyncApplication.kt'
      - 'app/src/test/**'
      - 'app/build.gradle.kts'
      - 'gradle/wrapper/gradle-wrapper.properties'
  push:
    branches:
      - telemetry-data
      - feature/v7-6-adaptive-decoder-ai-final
    paths:
      - 'fahrdaten/**/manifest.json'
      - 'tools/decoder_ai/**'
      - '.github/workflows/decoder-ai.yml'
      - 'app/src/main/java/de/kevin/vmaxdashboard/AdaptiveDecoderProfileStore.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/AdaptiveDecoderRuntime.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/BleScooterManager.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/DecoderAiCloudSync.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/ExternalAi*.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/GitHubSyncActivity.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/GitHubTelemetrySync.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/LearningProfileStore.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/MeasurementAnalyzer.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/ScooterState.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/LiveTelemetryDecoder.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/OriginalSdkRealtimeDecoder.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/VmaxDecoderPolicy.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/VmaxProtocolCatalog.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/VmaxSdkCapabilityCatalog.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/MainActivity.kt'
      - 'app/src/main/java/de/kevin/vmaxdashboard/VMAXSyncApplication.kt'
      - 'app/src/test/**'
      - 'app/build.gradle.kts'
      - 'gradle/wrapper/gradle-wrapper.properties'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decoder-ai:
    runs-on: ubuntu-latest
    env:
      ANALYZER_ROOT: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/telemetry-data')) && '.decoder-main' || '.' }}
    steps:
      - name: Repository laden
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Telemetriedaten für manuelle Neuberechnung laden
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: telemetry-data
          fetch-depth: 1

      - name: Aktuelle Decoder-Logik aus main laden
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/telemetry-data')
        uses: actions/checkout@v4
        with:
          ref: main
          path: .decoder-main
          fetch-depth: 1

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decoder-AI Module validieren
        run: |
          python -m py_compile "$ANALYZER_ROOT"/tools/decoder_ai/*.py
          python -m json.tool "$ANALYZER_ROOT/tools/decoder_ai/original_app_semantics.json" >/dev/null

      - name: Decoder-AI Tests
        run: |
          python -m unittest discover \
            -s "$ANALYZER_ROOT/tools/decoder_ai" \
            -p 'test_*.py'

      - name: libble SDK gegen BT638-Livestand vergleichen
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/telemetry-data')
        run: |
          python "$ANALYZER_ROOT/tools/decoder_ai/libble_compare.py" \
            --root fahrdaten \
            --output decoder-ai/libble_comparison.json \
            --report decoder-ai/libble_comparison.md

      - name: Original-App Sollwerte gegen BT638 abgleichen
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/telemetry-data')
        run: |
          python "$ANALYZER_ROOT/tools/decoder_ai/original_app_compare.py" \
            --semantics "$ANALYZER_ROOT/tools/decoder_ai/original_app_semantics.json" \
            --libble decoder-ai/libble_comparison.json \
            --output decoder-ai/original_app_comparison.json \
            --report decoder-ai/original_app_comparison.md

      - name: Unbekannte Felder über mehrere Fahrten lernen
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/telemetry-data')
        run: |
          python "$ANALYZER_ROOT/tools/decoder_ai/consensus.py" \
            --root fahrdaten \
            --output decoder-ai/decoder_profile.json \
            --report decoder-ai/analysis_report.md

      - name: 1509 Power ohne Selbstbestätigung gegen V mal A prüfen
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/telemetry-data')
        run: |
          python "$ANALYZER_ROOT/tools/decoder_ai/power_crosscheck.py" \
            --root fahrdaten \
            --output decoder-ai/power_crosscheck.json \
            --report decoder-ai/power_crosscheck.md

      - name: Selbstreferenzielle Evidenz gegen unabhängigen Vergleich absichern
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/telemetry-data')
        run: |
          python "$ANALYZER_ROOT/tools/decoder_ai/evidence_guard.py" \
            --profile decoder-ai/decoder_profile.json \
            --libble decoder-ai/libble_comparison.json \
            --power-crosscheck decoder-ai/power_crosscheck.json \
            --report decoder-ai/analysis_report.md

      - name: Gemini und GLM als unabhängige Zweitprüfung
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/telemetry-data')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY}${ZHIPU_API_KEY}" ]; then
            echo 'Gemini/GLM Secrets noch nicht gesetzt – deterministische Decoder-AI läuft ohne externe Zweitprüfung weiter.'
            exit 0
          fi
          # Die kompakten Markdown-Berichte enthalten den Gesamt-/Aggregate-Stand.
          # So sehen externe Prüfer nicht nur den Anfang eines großen JSONs bzw. eine einzelne Fahrt.
          python "$ANALYZER_ROOT/tools/decoder_ai/provider_review.py" \
            --analysis-report decoder-ai/analysis_report.md \
            --decoder-profile decoder-ai/decoder_profile.json \
            --libble decoder-ai/libble_comparison.md \
            --original-app decoder-ai/original_app_comparison.md \
            --output decoder-ai/provider_review.json \
            --report decoder-ai/provider_review.md

      - name: Reviewer-Ausgabe auf Vollständigkeit prüfen
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/telemetry-data')
        run: |
          if [ -f decoder-ai/provider_review.json ]; then
            python "$ANALYZER_ROOT/tools/decoder_ai/review_output_guard.py" \
              --input decoder-ai/provider_review.json \
              --output decoder-ai/provider_review.json \
              --report decoder-ai/provider_review.md
          fi

      - name: Neue Decoder-Ergebnisse speichern
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/telemetry-data')
        run: |
          git config user.name 'VMAX Decoder AI'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            decoder-ai/decoder_profile.json \
            decoder-ai/analysis_report.md \
            decoder-ai/libble_comparison.json \
            decoder-ai/libble_comparison.md \
            decoder-ai/original_app_comparison.json \
            decoder-ai/original_app_comparison.md \
            decoder-ai/power_crosscheck.json \
            decoder-ai/power_crosscheck.md
          for file in decoder-ai/provider_review.json decoder-ai/provider_review.md; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo 'Keine neue Decoder-Evidenz.'
            exit 0
          fi
          git commit -m 'Decoder AI: Original-App, libble und Fahrdaten abgleichen'
          git push origin HEAD:telemetry-data

  android-verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feature/v7-6-adaptive-decoder-ai-final'
    runs-on: ubuntu-latest
    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decoder-App testen und Debug-APK kompilieren
        run: |
          export VERSION_CODE=7600
          export VERSION_NAME='7.6.0-adaptive-ai-check'
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
