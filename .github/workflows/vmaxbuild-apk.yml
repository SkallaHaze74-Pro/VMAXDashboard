name: VMAX Dashboard Motor-Lab Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Debug-APK bauen
        run: |
          export VERSION_CODE=$((6400 + GITHUB_RUN_NUMBER))
          export VERSION_NAME="6.4.${GITHUB_RUN_NUMBER}-motor-lab"
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "VMAXDashboard-v${VERSION_NAME}-Debug.apk"

      - name: Debug-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: VMAXDashboard-Motor-Lab-Debug
          path: VMAXDashboard-v*-Debug.apk
          if-no-files-found: error
