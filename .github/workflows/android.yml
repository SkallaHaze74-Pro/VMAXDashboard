name: VMAX Dashboard Echtzeit-Test-Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Release-Signatur prüfen
        id: signing
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ] && \
             [ -n "$SIGNING_STORE_PASSWORD" ] && \
             [ -n "$SIGNING_KEY_ALIAS" ] && \
             [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Signaturschlüssel wiederherstellen
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/vmax-release-key.jks"

      - name: Signierte Echtzeit-Test-APK bauen
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/vmax-release-key.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          export VERSION_CODE=$((6800 + GITHUB_RUN_NUMBER))
          export VERSION_NAME="6.8.${GITHUB_RUN_NUMBER}-realtime-test"
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "Scooter-Telemetry-VX-Aktuell-v${VERSION_NAME}.apk"

      - name: Echtzeit-Test-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Scooter-Telemetry-VX-Aktuell-Echtzeit
          path: Scooter-Telemetry-VX-Aktuell-v*.apk
          if-no-files-found: error
